name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "ci/**"

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.23.4"
          check-latest: false
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(find . -type f -name '*.go' -not -path './vendor/*' -print0 | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'The following Go files are not formatted:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Download Go modules
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: false
